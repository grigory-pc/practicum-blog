<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента постов</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
<header>
    <h1>Лента постов</h1>
    <button onclick="showPostForm()">Добавить пост</button>
</header>
<div id="post-list"></div>
<div id="pagination">
    <button onclick="loadPosts(currentPage - 1)">Назад</button>
    <span>Страница <span id="page-number"></span></span>
    <button onclick="loadPosts(currentPage + 1)">Вперед</button>
</div>
<div id="post-form" style="display:none;">
    <h2>Добавить пост</h2>
    <input type="text" id="post-title" placeholder="Название поста" required>
    <input type="text" id="post-image" placeholder="Ссылка на изображение" required>
    <textarea id="post-text" placeholder="Текст поста" required></textarea>
    <input type="text" id="post-tags" placeholder="Теги (через запятую)" required>
    <button onclick="addPost()">Сохранить</button>
    <button onclick="hidePostForm()">Отмена</button>
</div>
<script>
    let currentPage = 1;
    const postsPerPage = 10;

    async function loadPosts(page) {
        const response = await fetch(`/api/posts?page=${page}&size=${postsPerPage}`);
        const data = await response.json();
        displayPosts(data.posts);
        updatePagination(data.totalPages, page);
    }

    function displayPosts(posts) {
        const postList = document.getElementById('post-list');
        postList.innerHTML = '';
        posts.forEach(post => {
            postList.innerHTML += `
                <div class="post-preview">
                    <h3><a href="post.html?id=${post.id}">${post.title}</a></h3>
                    <img src="${post.image}" alt="${post.title}">
                    <p>${post.text.substring(0, 100)}...</p>
                    <p>Комментарии: ${post.commentsCount} | Лайков: ${post.likesCount}</p>
                    <p>Теги: ${post.tags.join(', ')}</p>
                </div>`;
        });
    }

    function updatePagination(totalPages, currentPage) {
        document.getElementById('page-number').innerText = currentPage;
    }

    function showPostForm() {
        document.getElementById('post-form').style.display = 'block';
    }

    function hidePostForm() {
        document.getElementById('post-form').style.display = 'none';
    }

    async function addPost() {
        const post = {
            title: document.getElementById('post-title').value,
            image: document.getElementById('post-image').value,
            text: document.getElementById('post-text').value,
            tags: document.getElementById('post-tags').value.split(',').map(tag => tag.trim())
        };
        await fetch('/api/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(post)
        });
        hidePostForm();
        loadPosts(currentPage);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadPosts(currentPage);
    });
</script>
</body>
</html>
